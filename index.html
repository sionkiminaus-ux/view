<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>불러오는 중…</title></head>
<body style="font-family:-apple-system,sans-serif;padding:24px;color:#555">불러오는 중…
<script>
(async function(){
  var id=(location.search.slice(1).split(/[&=]/)[0]||'').replace(/[^0-9a-f]/gi,'');
  if(!id){document.body.textContent='링크에 Gist ID가 없어요.';return;}
  try{
    var r=await fetch('https://gist.githubusercontent.com/sionkiminaus-ux/'+id+'/raw/index.html?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    var h=await r.text();
    document.open();document.write(h);document.close();
  }catch(e){document.body.textContent='불러오기 실패: '+e.message;}
})();
</script>
</body></html>
